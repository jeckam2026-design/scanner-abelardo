<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Escáner de Asistencia - I.E.P. José Abelardo Quiñones Gonzales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1e3a5f;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .pantalla {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 16px; text-align: center; color: #fff;
  }
  header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,0.15);
    z-index: 5;
  }
  header img { height: 40px; }
  header h1 { font-size: 15px; margin: 0; line-height: 1.2; }
  #relojReloj { position: absolute; top: 10px; right: 16px; font-size: 14px; opacity: 0.85; z-index: 5; }

  #vistaCarga { display: flex; }

  #vistaLogin { display: none; }
  #vistaLogin .caja {
    background: rgba(255,255,255,0.08); border-radius: 14px; padding: 26px 24px;
    width: 300px; max-width: 85vw;
  }
  #vistaLogin h2 { margin: 0 0 16px; font-size: 17px; }
  #vistaLogin input { width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 6px; font-size: 14px; }
  #vistaLogin button {
    width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 6px;
    background: #d9a13c; color: #1e3a5f; font-weight: bold; font-size: 15px; cursor: pointer;
  }
  #vistaLogin button:disabled { opacity: 0.6; }
  #errorLogin { color: #ffb3b3; font-size: 13px; margin-top: 10px; min-height: 16px; }

  #vistaEscaneo {
    display: none; position: fixed; top:0; left:0; right:0; bottom:0; padding:0; justify-content:flex-start;
  }
  #lector { width: 100vw !important; height: 100vh !important; overflow: hidden; }
  #lector > div { width: 100% !important; height: 100% !important; }
  #lector video { width: 100% !important; height: 100% !important; object-fit: cover !important; transform: scaleX(-1); -webkit-transform: scaleX(-1); }
  #vistaEscaneo p.instruccion {
    position: absolute; bottom: 60px; left: 0; right: 0; margin: 0; font-size: 16px; opacity: 0.95;
    text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8); z-index: 6;
  }
  #vistaEscaneo p.instruccion strong { display: block; font-size: 20px; margin-bottom: 4px; }
  #panelTop {
    position: absolute; top: 55px; left: 8px; right: 8px; z-index: 6;
    background: rgba(0,0,0,0.45); border-radius: 8px; padding: 6px 10px;
  }
  #sesionActiva { font-size: 12px; opacity: 0.9; }
  #debugInfo { font-size: 11px; opacity: 0.85; margin-top: 4px; word-break: break-word; }
  #btnReiniciar {
    margin-top: 8px; font-size: 12px; padding: 6px 14px; border-radius: 6px; border: none;
    background: rgba(255,255,255,0.2); color: #fff; cursor: pointer;
  }
  #btnCerrarSesion {
    position: absolute; bottom: 10px; right: 16px; z-index: 6;
    font-size: 11px; opacity: 0.6; color: #fff; background: none; border: none; cursor: pointer;
  }

  #vistaVerificando { display: none; }
  .spinner {
    width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%; animation: girar 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  #vistaResultado { display: none; }
  .icono-resultado {
    width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 14px;
  }
  .icono-ok { background: #2fa84f; }
  .icono-tarde { background: #e0a800; }
  .icono-falta { background: #c0392b; }
  .icono-error { background: #7f8c8d; }

  #nombreEstudiante { font-size: 24px; font-weight: bold; margin: 6px 0 2px; }
  #detalleEstudiante { font-size: 15px; opacity: 0.85; margin-bottom: 10px; }
  #estadoTexto { font-size: 22px; font-weight: bold; padding: 8px 20px; border-radius: 30px; margin-top: 4px; }
  .fondo-ok { background: rgba(47,168,79,0.25); }
  .fondo-tarde { background: rgba(224,168,0,0.25); }
  .fondo-falta { background: rgba(192,57,43,0.25); }
  .fondo-error { background: rgba(127,140,141,0.25); }
  #contadorReset { font-size: 12px; opacity: 0.6; margin-top: 30px; }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
  <h1>I.E.P. José Abelardo Quiñones Gonzales<br>Registro de Asistencia QR</h1>
</header>
<div id="relojReloj"></div>

<div class="pantalla" id="vistaCarga"><p>Cargando...</p></div>

<div class="pantalla" id="vistaLogin">
  <div class="caja">
    <h2>Iniciar sesión para escanear</h2>
    <input type="text" id="loginNombre" placeholder="Nombre completo (usuario)">
    <input type="text" id="loginDni" placeholder="DNI (clave)">
    <button id="btnLogin" onclick="intentarLogin()">Ingresar</button>
    <div id="errorLogin"></div>
  </div>
</div>

<div class="pantalla" id="vistaEscaneo">
  <div id="lector"></div>
  <p class="instruccion"><strong>Acerca tu carnet a la cámara</strong>Escaneo automático de entrada / salida</p>
  <div id="panelTop">
    <div id="sesionActiva"></div>
    <div id="debugInfo"></div>
    <button id="btnReiniciar" onclick="location.reload()">Recargar CONFIG del Sheet</button>
  </div>
</div>

<div class="pantalla" id="vistaVerificando">
  <div class="spinner"></div>
  <p>Verificando con el servidor...</p>
</div>

<div class="pantalla" id="vistaResultado">
  <div class="icono-resultado" id="iconoResultado">✔</div>
  <div id="nombreEstudiante">—</div>
  <div id="detalleEstudiante">—</div>
  <div id="estadoTexto">—</div>
  <div id="contadorReset"></div>
</div>

<button id="btnCerrarSesion" onclick="cerrarSesion()">Cerrar sesión</button>

<script>
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwbFz2SlvxX-gbRIf9pjTBkgw4qZLZLwLicssIAKWYROEZqkDXaIguMiyXy3MkjsddC/exec";

  var procesando = false;
  var html5QrcodeScanner;
  var USUARIO_ACTIVO = null;

  // ---------- Sesión ----------
  function guardarSesion(usuario) { sessionStorage.setItem("sesionAdmin", JSON.stringify(usuario)); }
  function leerSesion() {
    var s = sessionStorage.getItem("sesionAdmin");
    return s ? JSON.parse(s) : null;
  }
  function cerrarSesion() {
    sessionStorage.removeItem("sesionAdmin");
    if (html5QrcodeScanner) { html5QrcodeScanner.stop().catch(function(){}); }
    location.reload();
  }

  function intentarLogin() {
    var nombre = document.getElementById("loginNombre").value.trim();
    var dni = document.getElementById("loginDni").value.trim();
    var err = document.getElementById("errorLogin");
    err.textContent = "";
    if (!nombre || !dni) { err.textContent = "Ingrese usuario y DNI."; return; }

    document.getElementById("btnLogin").disabled = true;
    fetch(WEBAPP_URL + "?accion=login&nombre=" + encodeURIComponent(nombre) + "&dni=" + encodeURIComponent(dni))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        document.getElementById("btnLogin").disabled = false;
        if (!data.ok) { err.textContent = data.mensaje || "Usuario o clave incorrectos."; return; }
        if (data.usuario.rol !== "ADMIN") { err.textContent = "Solo el personal ADMIN puede operar el escáner."; return; }
        USUARIO_ACTIVO = data.usuario;
        guardarSesion(USUARIO_ACTIVO);
        mostrarPantallaEscaneo();
      })
      .catch(function () {
        document.getElementById("btnLogin").disabled = false;
        err.textContent = "Error de conexión. Intente nuevamente.";
      });
  }

  function mostrarPantallaEscaneo() {
    document.getElementById("vistaCarga").style.display = "none";
    document.getElementById("vistaLogin").style.display = "none";
    document.getElementById("vistaEscaneo").style.display = "flex";
    document.getElementById("sesionActiva").textContent = "Sesión: " + USUARIO_ACTIVO.nombre;
    document.getElementById("debugInfo").textContent = "Listo para escanear.";
    iniciarEscaner();
  }

  function actualizarReloj() {
    var ahora = new Date();
    document.getElementById("relojReloj").textContent =
      ahora.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  setInterval(actualizarReloj, 1000);
  actualizarReloj();

  // ---------- Cámara ----------
  function iniciarEscaner() {
    html5QrcodeScanner = new Html5Qrcode("lector");
    var config = {
      fps: 20,
      qrbox: function (w, h) { var lado = Math.floor(Math.min(w, h) * 0.7); return { width: lado, height: lado }; },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };
    html5QrcodeScanner.start({ facingMode: "user" }, config, onEscaneoExitoso, function () {})
      .catch(function () {
        Html5Qrcode.getCameras().then(function (camaras) {
          if (camaras && camaras.length) {
            html5QrcodeScanner.start(camaras[0].id, config, onEscaneoExitoso, function () {});
          }
        });
      });
  }

  function onEscaneoExitoso(idDetectado) {
    if (procesando) return;
    var idQR = idDetectado.trim().toUpperCase();
    if (idQR === ultimoIdMostrado) return; // evita doble lectura del mismo carnet sin moverlo
    procesando = true;

    // Confirmación INMEDIATA en pantalla (sin esperar al servidor) — solo confirma que se leyó
    mostrarConfirmacionRapida(idQR);

    // Se manda a registrar en segundo plano, sin bloquear el siguiente escaneo.
    // Cualquier duplicado o inconsistencia lo resuelve el trigger de limpieza nocturno.
    fetch(WEBAPP_URL + "?accion=registrarAsistencia&id=" + encodeURIComponent(idQR))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        document.getElementById("debugInfo").textContent = "Última respuesta (" + idQR + "): " + JSON.stringify(data);
      })
      .catch(function (err) {
        document.getElementById("debugInfo").textContent = "ERROR DE RED (" + idQR + "): " + err.message;
      });
  }

  var ultimoIdMostrado = null;
  var timeoutResumen = null;

  // Muestra una confirmación breve de que el QR se leyó, y vuelve a escanear casi al instante
  function mostrarConfirmacionRapida(idQR) {
    ultimoIdMostrado = idQR;
    document.getElementById("vistaEscaneo").style.display = "none";
    document.getElementById("vistaResultado").style.display = "flex";

    var icono = document.getElementById("iconoResultado");
    var estadoDiv = document.getElementById("estadoTexto");
    var nombreDiv = document.getElementById("nombreEstudiante");
    var detalleDiv = document.getElementById("detalleEstudiante");

    icono.className = "icono-resultado icono-ok";
    icono.textContent = "✔";
    nombreDiv.textContent = idQR;
    detalleDiv.textContent = "Registrando...";
    estadoDiv.className = "fondo-ok";
    estadoDiv.textContent = "LEÍDO";

    document.getElementById("contadorReset").textContent = "";
    if (timeoutResumen) clearTimeout(timeoutResumen);
    timeoutResumen = setTimeout(volverAEscanear, 500); // vuelve casi de inmediato
  }

  function volverAEscanear() {
    document.getElementById("vistaResultado").style.display = "none";
    document.getElementById("vistaEscaneo").style.display = "flex";
    procesando = false;
    // Libera el "último ID" después de un momento, para permitir volver a escanear
    // el mismo carnet más tarde (ej. a la hora de salida) sin bloquear el sistema.
    setTimeout(function () { ultimoIdMostrado = null; }, 3000);
    html5QrcodeScanner.resume();
  }

  // ---------- Arranque ----------
  window.onload = function () {
    var sesion = leerSesion();
    document.getElementById("vistaCarga").style.display = "none";
    if (sesion) {
      USUARIO_ACTIVO = sesion;
      mostrarPantallaEscaneo();
    } else {
      document.getElementById("vistaLogin").style.display = "flex";
    }
  };
</script>

</body>
</html>
